[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "highlights"
version = "0.1.0"
description = "Twitch clips to YouTube, with a transcript and real metadata."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1", "numpy>=1.26"]
test = ["pytest>=8", "numpy>=1.26"]
dev = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
highlights = "highlights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
